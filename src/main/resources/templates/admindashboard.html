<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>Admin Panel</title>

<link rel="stylesheet" th:href="@{/css/admindashboard.css}">

</head>

<body>

<div class="layout">

<!-- SIDEBAR -->
<div class="sidebar">

<h2>SCOPE ADMIN</h2>

<a href="#" onclick="showSection('dashboard')">Dashboard</a>
<a href="#" onclick="showSection('students')">Students</a>
<a href="#" onclick="showSection('courses')">Courses</a>
<a href="#" onclick="showSection('trainers')">Trainers</a>

<a th:href="@{/logout}" class="logout">Logout</a>

</div>


<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard" class="section active">

<h1>Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Total Students</h3>
<p th:text="${totalStudents}">0</p>
</div>

<div class="card">
<h3>Total Courses</h3>
<p th:text="${totalCourses}">0</p>
</div>

<div class="card">
<h3>Total Trainers</h3>
<p th:text="${totalTrainers}">0</p>
</div>

</div>

</div>


<!-- STUDENTS CRUD -->
<div id="students" class="section">

<h1>Students</h1>

<form th:action="@{/admin/students/add}" method="post" class="form">

<input type="text" name="firstName" placeholder="First Name" required>
<input type="text" name="lastName" placeholder="Last Name" required>
<input type="email" name="email" placeholder="Email" required>
<input type="text" name="phone" placeholder="Phone" required>
<input type="text" name="course" placeholder="Course" required>
<input type="text" name="branch" placeholder="Branch" required>

<button type="submit">Add Student</button>

</form>

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Course</th>
<th>Branch</th>
<th>Action</th>
</tr>
</thead>

<tbody>

<tr th:each="s : ${students}">

<td th:text="${s.id}"></td>

<td th:text="${s.firstName + ' ' + s.lastName}"></td>

<td th:text="${s.email}"></td>

<td th:text="${s.course}"></td>

<td th:text="${s.branch}"></td>

<td>

<a th:href="@{/admin/students/delete/{id}(id=${s.id})}" class="delete">Delete</a>

</td>

</tr>

</tbody>

</table>

</div>


<!-- COURSES -->
<div id="courses" class="section">

<h1>Courses</h1>

<form th:action="@{/admin/courses/add}" method="post" class="form">

<input type="text" name="name" placeholder="Course Name">
<input type="text" name="duration" placeholder="Duration">

<button>Add Course</button>

</form>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Duration</th>
<th>Action</th>
</tr>

<tr th:each="c : ${courses}">

<td th:text="${c.id}"></td>
<td th:text="${c.name}"></td>
<td th:text="${c.duration}"></td>

<td>
<a th:href="@{/admin/courses/delete/{id}(id=${c.id})}" class="delete">Delete</a>
</td>

</tr>

</table>

</div>


<!-- TRAINERS -->
<div id="trainers" class="section">

<h1>Trainers</h1>

<form th:action="@{/admin/trainers/add}" method="post" class="form">

<input type="text" name="name" placeholder="Trainer Name">
<input type="text" name="specialisation" placeholder="Specialisation">
<input type="text" name="branch" placeholder="Branch">

<button>Add Trainer</button>

</form>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Specialisation</th>
<th>Branch</th>
<th>Action</th>
</tr>

<tr th:each="t : ${trainers}">

<td th:text="${t.id}"></td>
<td th:text="${t.name}"></td>
<td th:text="${t.specialisation}"></td>
<td th:text="${t.branch}"></td>

<td>
<a th:href="@{/admin/trainers/delete/{id}(id=${t.id})}" class="delete">Delete</a>
</td>

</tr>

</table>

</div>

</div>

</div>

<script>

function showSection(section){

document.querySelectorAll(".section")
.forEach(s => s.classList.remove("active"))

document.getElementById(section)
.classList.add("active")

}

</script>

</body>
</html>
