<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOPE INDIA | Verify Email</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #060e30;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(ellipse 60% 50% at 20% 20%, rgba(245,196,0,0.05) 0%, transparent 60%),
                radial-gradient(ellipse 50% 60% at 80% 80%, rgba(5,15,56,0.8) 0%, transparent 60%);
        }

        .ve-card {
            background: #030a28;
            border: 1px solid rgba(245,196,0,0.15);
            border-radius: 20px;
            padding: 44px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5);
            animation: cardIn 0.4s cubic-bezier(0.4,0,0.2,1);
        }
        @keyframes cardIn {
            from { opacity:0; transform:translateY(24px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .ve-logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            color: #ffffff;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .ve-logo span { color: #f5c400; }

        .ve-icon-wrap {
            width: 64px; height: 64px;
            background: rgba(245,196,0,0.1);
            border: 1px solid rgba(245,196,0,0.2);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 24px;
        }

        .ve-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .ve-subtitle {
            font-size: 0.84rem;
            color: rgba(255,255,255,0.42);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Success / Error messages */
        .ve-msg {
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
        }
        .ve-msg.show { display: block; }
        .ve-msg--ok  { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.25); color: #4ade80; }
        .ve-msg--err { background: rgba(245,98,90,0.1);  border: 1px solid rgba(245,98,90,0.25);  color: #f5625a; }

        /* Steps */
        .ve-steps { display: flex; flex-direction: column; gap: 16px; }

        /* Step block */
        .ve-step {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(245,196,0,0.08);
            border-radius: 12px;
            padding: 18px;
            transition: border-color 0.2s;
        }
        .ve-step.active { border-color: rgba(245,196,0,0.2); }

        .ve-step-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255,255,255,0.28);
            margin-bottom: 10px;
        }
        .ve-step-label span {
            color: #f5c400;
            margin-right: 6px;
        }

        /* Send OTP button */
        .ve-btn-send {
            width: 100%;
            background: linear-gradient(135deg, #f5c400, #d4a800);
            color: #030a28;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .ve-btn-send:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
        .ve-btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* OTP form */
        .ve-otp-form { display: flex; flex-direction: column; gap: 12px; }

        .ve-input-wrap { position: relative; }
        .ve-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(245,196,0,0.15);
            border-radius: 10px;
            padding: 12px 16px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .ve-input::placeholder { color: rgba(255,255,255,0.2); letter-spacing: 2px; font-weight: 400; font-size: 0.84rem; }
        .ve-input:focus { border-color: rgba(245,196,0,0.5); box-shadow: 0 0 0 3px rgba(245,196,0,0.08); }

        .ve-btn-verify {
            width: 100%;
            background: #030a28;
            color: #f5c400;
            border: 1px solid rgba(245,196,0,0.35);
            border-radius: 10px;
            padding: 13px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
        }
        .ve-btn-verify:hover { background: rgba(245,196,0,0.07); border-color: rgba(245,196,0,0.6); transform: translateY(-1px); }

        /* Countdown */
        .ve-countdown {
            text-align: center;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
            min-height: 20px;
        }
        .ve-countdown b { color: #f5c400; }

        /* Divider */
        .ve-divider {
            display: flex; align-items: center; gap: 12px;
            margin: 24px 0 16px;
        }
        .ve-divider::before, .ve-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(245,196,0,0.08);
        }
        .ve-divider span { font-size: 0.72rem; color: rgba(255,255,255,0.25); white-space: nowrap; }

        .ve-back {
            display: block;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.35);
            text-decoration: none;
            transition: color 0.2s;
        }
        .ve-back:hover { color: #f5c400; }

        /* CSRF hidden */
        input[type="hidden"] { display: none; }
    </style>
</head>
<body>

<div class="ve-card">

    <div class="ve-logo">SCOPE<span>INDIA</span></div>

    <div class="ve-icon-wrap">&#x2709;&#xFE0F;</div>

    <h1 class="ve-title">Verify your email</h1>
    <p class="ve-subtitle">We'll send a one-time password to your registered email address. Enter it below to activate your account.</p>

    <!-- Feedback messages -->
    <div class="ve-msg ve-msg--ok"  id="msgOk"></div>
    <div class="ve-msg ve-msg--err" id="msgErr"></div>

    <div class="ve-steps">

        <!-- Step 1 — Send OTP -->
        <div class="ve-step active" id="step1">
            <div class="ve-step-label"><span>01</span>Send OTP to your email</div>
            <button class="ve-btn-send" id="sendBtn" onclick="sendOtp()">
                <span>&#x1F4E7;</span> Send OTP
            </button>
            <div class="ve-countdown" id="countdown"></div>
        </div>

        <!-- Step 2 — Enter OTP -->
        <div class="ve-step" id="step2">
            <div class="ve-step-label"><span>02</span>Enter the OTP</div>
            <form action="/student/verify-otp" method="post" class="ve-otp-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="ve-input-wrap">
                    <input type="text" name="otp" class="ve-input"
                           placeholder="· · · · · ·"
                           maxlength="6"
                           autocomplete="one-time-code"
                           inputmode="numeric"
                           required>
                </div>
                <button type="submit" class="ve-btn-verify">&#x2713; Verify &amp; Continue</button>
            </form>
        </div>

    </div>

    <div class="ve-divider"><span>already verified?</span></div>
    <a th:href="@{/student/dashboard}" class="ve-back">&#x2190; Go to dashboard</a>

</div>

<script>
var countdownTimer = null;

function showMsg(type, text) {
    var ok  = document.getElementById('msgOk');
    var err = document.getElementById('msgErr');
    ok.classList.remove('show');
    err.classList.remove('show');
    if (type === 'ok')  { ok.textContent  = text; ok.classList.add('show'); }
    if (type === 'err') { err.textContent = text; err.classList.add('show'); }
}

function startCountdown(seconds) {
    var cd  = document.getElementById('countdown');
    var btn = document.getElementById('sendBtn');
    clearInterval(countdownTimer);
    btn.disabled = true;
    countdownTimer = setInterval(function() {
        if (seconds <= 0) {
            clearInterval(countdownTimer);
            btn.disabled = false;
            cd.innerHTML = '';
            return;
        }
        cd.innerHTML = 'Resend available in <b>' + seconds + 's</b>';
        seconds--;
    }, 1000);
}

function sendOtp() {
    var btn   = document.getElementById('sendBtn');
    var token = document.querySelector('input[name="_csrf"]').value;

    btn.disabled = true;
    btn.innerHTML = '<span>&#x23F3;</span> Sending...';

    fetch('/student/send-otp', {
        method: 'POST',
        headers: { 'X-CSRF-TOKEN': token }
    })
    .then(function(res) { return res.text(); })
    .then(function(data) {
        btn.innerHTML = '<span>&#x2713;</span> OTP Sent';
        showMsg('ok', data);
        document.getElementById('step2').classList.add('active');
        startCountdown(60);
    })
    .catch(function() {
        btn.disabled = false;
        btn.innerHTML = '<span>&#x1F4E7;</span> Send OTP';
        showMsg('err', 'Failed to send OTP');
    });
}

/* Auto-format OTP input — digits only */
document.querySelector('.ve-input').addEventListener('input', function(e) {
    this.value = this.value.replace(/\D/g, '').slice(0, 6);
});
</script>

</body>
</html>
