<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>Student Dashboard</title>

<link rel="stylesheet" th:href="@{/css/studentdashboard.css}">

</head>

<body>

<div class="layout">

<!-- SIDEBAR -->
<div class="sidebar">

<h2>STUDENT</h2>

<a href="#" onclick="showSection('dashboard')">Dashboard</a>
<a href="#" onclick="showSection('profile')">My Profile</a>
<a href="#" onclick="showSection('course')">My Course</a>
<a href="#" onclick="showSection('announcements')">Announcements</a>

<a th:href="@{/logout}" class="logout">Logout</a>

</div>


<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard" class="section active">

<h1>Welcome</h1>

<div class="cards">

<div class="card">
<h3>Name</h3>
<p th:text="${student.firstName + ' ' + student.lastName}"></p>
</div>

<div class="card">
<h3>Course</h3>
<p th:text="${student.course}"></p>
</div>

<div class="card">
<h3>Branch</h3>
<p th:text="${student.branch}"></p>
</div>

</div>

</div>


<!-- PROFILE -->
<div id="profile" class="section">

<h1>My Profile</h1>

<table>

<tr>
<td>Name</td>
<td th:text="${student.firstName + ' ' + student.lastName}"></td>
</tr>

<tr>
<td>Email</td>
<td th:text="${student.email}"></td>
</tr>

<tr>
<td>Phone</td>
<td th:text="${student.phone}"></td>
</tr>

<tr>
<td>Course</td>
<td th:text="${student.course}"></td>
</tr>

<tr>
<td>Branch</td>
<td th:text="${student.branch}"></td>
</tr>

</table>

</div>


<!-- COURSE -->
<div id="course" class="section">

<h1>My Course</h1>

<div class="card-large">

<h3 th:text="${student.course}"></h3>

<p>Welcome to your course dashboard.</p>

</div>

</div>


<!-- ANNOUNCEMENTS -->
<div id="announcements" class="section">

<h1>Announcements</h1>

<div th:each="a : ${announcements}" class="announcement">

<h3 th:text="${a.title}"></h3>

<p th:text="${a.body}"></p>

</div>

</div>

</div>

</div>

<script>

function showSection(section){

document.querySelectorAll(".section")
.forEach(s => s.classList.remove("active"))

document.getElementById(section)
.classList.add("active")

}

</script>

</body>
</html>
