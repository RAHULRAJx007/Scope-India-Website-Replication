<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOPE INDIA | Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #060e30;
            color: #ffffff;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(ellipse 60% 50% at 15% 20%, rgba(245,196,0,0.05) 0%, transparent 60%),
                radial-gradient(ellipse 50% 60% at 85% 80%, rgba(5,15,56,0.8) 0%, transparent 60%);
        }
        .rp-card {
            background: #030a28;
            border: 1px solid rgba(245,196,0,0.15);
            border-radius: 20px;
            padding: 44px 40px;
            width: 100%; max-width: 420px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5);
            animation: cardIn 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        @keyframes cardIn {
            from { opacity:0; transform:translateY(22px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .rp-logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900; font-size: 1rem;
            letter-spacing: 1.5px; margin-bottom: 32px;
        }
        .rp-logo span { color: #f5c400; }
        .rp-icon {
            width: 60px; height: 60px;
            background: rgba(245,196,0,0.1);
            border: 1px solid rgba(245,196,0,0.2);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; margin-bottom: 22px;
        }
        .rp-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900; font-size: 1.4rem;
            color: #ffffff; margin-bottom: 8px;
        }
        .rp-subtitle {
            font-size: 0.84rem; color: rgba(255,255,255,0.4);
            line-height: 1.6; margin-bottom: 28px;
        }

        /* Messages */
        .rp-msg {
            padding: 11px 14px; border-radius: 8px;
            font-size: 0.82rem; font-weight: 500;
            margin-bottom: 18px;
        }
        .rp-msg--err { background: rgba(245,98,90,0.1); border: 1px solid rgba(245,98,90,0.25); color: #f5625a; }

        /* Steps */
        .rp-steps {
            display: flex; align-items: center;
            gap: 6px; margin-bottom: 28px;
        }
        .rp-step {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.72rem; color: rgba(255,255,255,0.25);
        }
        .rp-step-dot {
            width: 22px; height: 22px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 700;
        }
        .rp-step.done .rp-step-dot {
            background: rgba(74,222,128,0.15);
            border: 1px solid rgba(74,222,128,0.35);
            color: #4ade80;
        }
        .rp-step.done { color: rgba(255,255,255,0.35); }
        .rp-step.active .rp-step-dot {
            background: rgba(245,196,0,0.15);
            border: 1px solid rgba(245,196,0,0.4);
            color: #f5c400;
        }
        .rp-step.active { color: rgba(255,255,255,0.6); }
        .rp-step-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }

        .rp-form { display: flex; flex-direction: column; gap: 14px; }
        .rp-group { display: flex; flex-direction: column; gap: 6px; }
        .rp-group label {
            font-size: 0.72rem; font-weight: 700;
            color: rgba(255,255,255,0.38);
            text-transform: uppercase; letter-spacing: 0.6px;
        }
        .rp-pw-wrap { position: relative; display: flex; align-items: center; }
        .rp-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(245,196,0,0.15);
            border-radius: 10px; padding: 12px 42px 12px 16px;
            color: #ffffff; font-family: 'Inter', sans-serif;
            font-size: 0.88rem; outline: none; width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .rp-input::placeholder { color: rgba(255,255,255,0.22); }
        .rp-input:focus {
            border-color: rgba(245,196,0,0.5);
            box-shadow: 0 0 0 3px rgba(245,196,0,0.07);
        }
        .rp-eye {
            position: absolute; right: 10px;
            background: none; border: none;
            cursor: pointer; font-size: 1rem;
            opacity: 0.4; padding: 4px;
            transition: opacity 0.2s; color: #ffffff;
        }
        .rp-eye:hover { opacity: 0.8; }

        /* Password strength */
        .rp-strength { margin-top: 8px; }
        .rp-strength-bar {
            height: 4px; border-radius: 4px;
            background: rgba(255,255,255,0.08);
            overflow: hidden; margin-bottom: 5px;
        }
        .rp-strength-fill {
            height: 100%; width: 0%;
            border-radius: 4px;
            transition: width 0.3s, background 0.3s;
        }
        .rp-strength-label {
            font-size: 0.72rem; color: rgba(255,255,255,0.3);
        }

        .rp-btn {
            width: 100%;
            background: linear-gradient(135deg, #f5c400, #d4a800);
            color: #030a28; border: none; border-radius: 10px;
            padding: 13px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; font-size: 0.88rem;
            cursor: pointer; margin-top: 4px;
            transition: opacity 0.2s, transform 0.15s;
        }
        .rp-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .rp-divider {
            display: flex; align-items: center; gap: 12px;
            margin: 24px 0 16px;
        }
        .rp-divider::before, .rp-divider::after {
            content: ''; flex: 1; height: 1px;
            background: rgba(245,196,0,0.08);
        }
        .rp-divider span { font-size: 0.72rem; color: rgba(255,255,255,0.25); }
        .rp-back {
            display: block; text-align: center;
            font-size: 0.8rem; color: rgba(255,255,255,0.35);
            text-decoration: none; transition: color 0.2s;
        }
        .rp-back:hover { color: #f5c400; }

        @media (max-width: 480px) {
            .rp-card { padding: 32px 22px; }
        }
    </style>
</head>
<body>

<div class="rp-card">

    <div class="rp-logo">SCOPE<span>INDIA</span></div>

    <!-- Progress steps -->
    <div class="rp-steps">
        <div class="rp-step done">
            <div class="rp-step-dot">&#x2713;</div>
            <span>Email</span>
        </div>
        <div class="rp-step-line"></div>
        <div class="rp-step done">
            <div class="rp-step-dot">&#x2713;</div>
            <span>Link opened</span>
        </div>
        <div class="rp-step-line"></div>
        <div class="rp-step active">
            <div class="rp-step-dot">3</div>
            <span>New password</span>
        </div>
    </div>

    <div class="rp-icon">&#x1F511;</div>
    <h1 class="rp-title">Set new password</h1>
    <p class="rp-subtitle">Choose a strong password for your Scope India account.</p>

    <!-- Token expired error -->
    <div class="rp-msg rp-msg--err" th:if="${param.invalid}" >
        &#x2715; This reset link is invalid or has expired. Please request a new one.
    </div>

    <form action="/reset-password" method="post" class="rp-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="token" th:value="${token}">

        <div class="rp-group">
            <label>New Password</label>
            <div class="rp-pw-wrap">
                <input type="password" name="password" id="rp_pw" class="rp-input"
                       placeholder="Enter new password"
                       oninput="checkStrength(this.value)"
                       required autofocus>
                <button type="button" class="rp-eye" onclick="toggleRpPw('rp_pw',this)" tabindex="-1">&#x1F441;</button>
            </div>
            <div class="rp-strength">
                <div class="rp-strength-bar"><div class="rp-strength-fill" id="strengthFill"></div></div>
                <span class="rp-strength-label" id="strengthLabel"></span>
            </div>
        </div>

        <div class="rp-group">
            <label>Confirm Password</label>
            <div class="rp-pw-wrap">
                <input type="password" name="confirmPassword" id="rp_confirm" class="rp-input"
                       placeholder="Confirm new password" required>
                <button type="button" class="rp-eye" onclick="toggleRpPw('rp_confirm',this)" tabindex="-1">&#x1F441;</button>
            </div>
        </div>

        <button type="submit" class="rp-btn">&#x1F512; Reset Password</button>
    </form>

    <div class="rp-divider"><span>remember it now?</span></div>
    <a th:href="@{/login}" class="rp-back">&#x2190; Back to Login</a>

</div>

<script>
function toggleRpPw(id, btn) {
    var input = document.getElementById(id);
    var hidden = input.type === 'password';
    input.type = hidden ? 'text' : 'password';
    btn.style.opacity = hidden ? '1' : '0.4';
}

function checkStrength(val) {
    var fill  = document.getElementById('strengthFill');
    var label = document.getElementById('strengthLabel');
    var score = 0;
    if (val.length >= 8)          score++;
    if (/[A-Z]/.test(val))        score++;
    if (/[0-9]/.test(val))        score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    var configs = [
        { w: '0%',   bg: 'transparent',  text: '' },
        { w: '25%',  bg: '#f5625a',       text: 'Weak' },
        { w: '50%',  bg: '#f5a623',       text: 'Fair' },
        { w: '75%',  bg: '#60a5fa',       text: 'Good' },
        { w: '100%', bg: '#4ade80',       text: 'Strong' }
    ];
    var c = configs[score];
    fill.style.width      = val.length ? c.w : '0%';
    fill.style.background = c.bg;
    label.textContent     = val.length ? c.text : '';
    label.style.color     = c.bg;
}
</script>

</body>
</html>
